# https://micro-os-plus.github.io/architecture-cortexm-xpack/
# https://github.com/micro-os-plus/architecture-cortexm-xpack/actions/workflows/test-ci.yml

# Workflow for running some tests on each Push.
name: Test on Push

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows

on:
  # Runs on pushes, if all conditions are met:
  push:
    # ... on the active branches ...
    branches:
      - 'xpack-development'
      - 'xpack'
    # ... skip tags only ...
    tags-ignore:
      - '**'
    # ... include everything except ...
    paths-ignore:
      - '.claude/**'
      - '.github/skills/**'
      - '.github/workflows/publish-github-pages.yml'
      - '.github/workflows/test-all.yml'
      - '.github/copilot-instructions.md'
      - '.github/FUNDING.yml'
      - '.settings/**'
      - '.vscode/**'
      - 'maintenance/**'
      - 'tests/scripts/**'
      - 'website/**'
      - 'LICENSE*'
      - '**.md'
      - '.gitignore'
      - '.npmignore'
      - '**/README**'

# Allow one concurrent run per push; new pushes cancel older runs.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: 'tests-ci-${{ github.ref_name }}'
  # A new push to the same branch cancels the older run.
  cancel-in-progress: true

jobs:
  ci-test:
    name: 'Architecture: Cortex-M CI tests'

    runs-on: ${{ matrix.os }}

    strategy:
      # Run all platforms to completion, even if one fails.
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images
        os:
          [
            'ubuntu-24.04',
            'ubuntu-24.04-arm',
            'macos-15-intel',
            'macos-15',
            'windows-2025'
          ]
        # https://nodejs.org/en - use LTS
        node-version: ['24']
        # https://www.npmjs.com/package/xpm
        xpm-version: ['0.23.2']

    steps:
      - name: Checkout
        # https://github.com/actions/checkout/
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 3

      - name: Setup Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install xpm@${{ matrix.xpm-version }} on ${{ matrix.os }}
        run: npm install -g xpm@${{ matrix.xpm-version }}

      - name: Show environment
        run: |
          id
          uname -a
          node --version
          npm --version
          xpm --version
          env | sort

      - name: Satisfy project dependencies on ${{ matrix.os }}
        run: |
          npm ci
          npm ci
          xpm install
          xpm run install-ci

      - name: Run tests on ${{ matrix.os }}
        run: xpm run test-ci
        env:
          CI: true
